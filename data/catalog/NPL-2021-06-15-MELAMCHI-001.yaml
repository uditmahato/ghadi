# The 15 June 2021 Melamchi flood, Sindhupalchok: a cascading chain — heavy rain,
# snowmelt, a glacial-lake-related outburst in the Pemdang Khola headwaters, breach
# of an old landslide dam at Bremthang, and a fresh landslide at Melamchigaon.
# Origin time is news-derived and coarse; the cascade had multiple pulses.

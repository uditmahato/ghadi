# The 2 August 2014 Jure / Sunkoshi landslide and landslide dam. ~5.5 million m^3;
# buried Jure village around 02:30 NPT (which is 20:45 UTC on 1 August — the event_id
# keeps the local date the event is known by). The debris dam impounded a 47 m lake
# and took 45 days to drain under controlled excavation.
